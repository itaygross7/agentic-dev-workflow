# Fixed mypy config for the PostToolUse hook. Exists so the hook never reads a
# repo-supplied config, which could name `plugins =` modules that mypy imports
# (i.e. arbitrary code execution just from editing a file in that repo).
[mypy]
plugins =
follow_imports = silent
ignore_missing_imports = True
check_untyped_defs = True
warn_unused_configs = False
